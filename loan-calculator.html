<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="대출 원금과 금리, 기간으로 원리금균등 월 상환액과 총이자를 계산합니다."><title>대출 상환 계산기 | 세금한눈에</title><link rel="canonical" href="https://tax-calculator-b1a.pages.dev/loan-calculator.html"><style>:root{--ink:#17231f;--green:#176b51;--line:#e2e8e0;--bg:#f6f7f4;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}header{padding:18px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.brand{font-weight:850;color:var(--ink);text-decoration:none}a{color:var(--green)}main{padding:30px 0}.eyebrow{color:var(--green);font-weight:800;font-size:13px}h1{font-size:clamp(28px,5vw,40px);margin:8px 0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}.field{margin:14px 0}.field label{display:block;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ccd8cd;border-radius:10px;font:inherit}.help{font-size:12px;color:#59675f}.button{width:100%;border:0;border-radius:11px;background:var(--green);color:#fff;padding:14px;font:inherit;font-weight:800}.result{display:none;background:#edf5ee;padding:16px;border-radius:12px;margin-top:16px}.result.show{display:block}.big{font-size:30px;color:var(--green);font-weight:850}.warning{background:#fff4f2;color:#5f1a17;border-left:5px solid var(--red);padding:14px;font-size:13px;font-weight:600}footer{border-top:1px solid var(--line);padding:20px 0;font-size:12px}</style><script async src="https://www.googletagmanager.com/gtag/js?id=G-S2DMJE466T"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-S2DMJE466T');</script></head><body><header class="wrap"><a class="brand" href="/">₩ 세금한눈에</a><a href="/">홈으로 돌아가기 ←</a></header><main class="wrap"><span class="eyebrow">대출 계획</span><h1>대출 상환 계산기</h1><p>대출 원금, 연이율과 기간으로 원리금균등 상환을 추정합니다.</p><form class="panel" id="form"><div class="field"><label for="principal">대출 원금</label><input id="principal" data-money inputmode="numeric" value="100,000,000" required></div><div class="field"><label for="rate">연이율 (%)</label><input id="rate" type="number" min="0" max="100" step="0.01" value="4.5" required></div><div class="field"><label for="months">상환 기간 (개월)</label><input id="months" type="number" min="1" max="600" value="360" required><div class="help">실제 대출은 변동금리, 중도상환수수료, 상환일에 따라 달라집니다.</div></div><button class="button">월 상환액 계산</button><section class="result" id="result" aria-live="polite"><div class="big" id="monthly"></div><div id="total"></div><div id="interest"></div></section><p class="warning"><strong>참고용 추정치입니다.</strong> 원리금균등·고정금리로 계산합니다. 실제 금융기관의 상환액 또는 대출 가능 금액이 아닙니다.</p></form><section class="panel"><h2>계산 방식</h2><p>매월 같은 금액을 내는 원리금균등 방식의 월 납입액 공식으로 계산하며, 연이율을 12로 나눈 월이율을 적용합니다.</p></section></main><footer class="wrap">금융상품 계약 전 금융기관의 상환예정표와 약관을 확인하세요. <a href="/privacy.html">개인정보처리방침</a></footer><script>const principal=document.querySelector('#principal'),won=n=>Math.round(n).toLocaleString('ko-KR')+'원';principal.addEventListener('input',()=>{const d=principal.value.replace(/[^0-9]/g,'');principal.value=d?Number(d).toLocaleString('ko-KR'):''});document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const p=Number(principal.value.replace(/[^0-9]/g,''))||0,r=Number(document.querySelector('#rate').value)/1200,n=Number(document.querySelector('#months').value);const m=r===0?p/n:p*r/(1-Math.pow(1+r,-n)),total=m*n;document.querySelector('#monthly').textContent='월 납입액 '+won(m);document.querySelector('#total').textContent='총 상환액 '+won(total);document.querySelector('#interest').textContent='총 이자 '+won(total-p);document.querySelector('#result').classList.add('show');if(typeof gtag==='function')gtag('event','calculator_use',{calculator_name:'loan_calculator'});});</script></body></html>
